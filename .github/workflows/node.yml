name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # better-sqlite3 >=13 (devDependency, used in tests) requires Node >=22.
        # The library itself still supports Node >=18.17.1 when used with
        # older better-sqlite3 versions (peer dependency allows any version).
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Test prototype implementations
        run: |
          INDEXER_IMPL=../index-batched.js npx borp
          INDEXER_IMPL=../index-hybrid.js npx borp
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          path-to-lcov: 'coverage/lcov.info'
          github-token: ${{ secrets.GITHUB_TOKEN }}
